<svg xmlns="http://www.w3.org/2000/svg" width="200" height="80" viewBox="0 0 200 80">
  <style>
    .text-primary { fill: #2196F3; }
    .text-secondary { fill: #4CAF50; }
    .icon-primary { fill: #2196F3; }
    .icon-accent { fill: #FFC107; }
  </style>
  
  <!-- Document/Receipt Icon -->
  <g transform="translate(20, 15)">
    <rect class="icon-primary" x="0" y="5" width="40" height="50" rx="2" ry="2" />
    <rect fill="white" x="5" y="10" width="30" height="40" rx="1" ry="1" />
    
    <!-- Receipt lines -->
    <line x1="10" y1="20" x2="30" y2="20" stroke="#212121" stroke-width="2" />
    <line x1="10" y1="30" x2="25" y2="30" stroke="#212121" stroke-width="2" />
    <line x1="10" y1="40" x2="30" y2="40" stroke="#212121" stroke-width="2" />
    
    <!-- Camera icon overlay -->
    <circle class="icon-accent" cx="35" cy="15" r="15" />
    <circle fill="white" cx="35" cy="15" r="7" />
    <circle fill="#212121" cx="35" cy="15" r="4" />
    
    <!-- Camera flash -->
    <path fill="white" d="M30,8 L35,3 L35,13 L30,8 Z" />
  </g>
  
  <!-- App Name -->
  <text x="70" y="35" font-family="Roboto, sans-serif" font-size="22" font-weight="bold" class="text-primary">Sken</text>
  <text x="122" y="35" font-family="Roboto, sans-serif" font-size="22" font-weight="bold" class="text-secondary">Účtenek</text>
  
  <!-- Tagline -->
  <text x="70" y="55" font-family="Roboto, sans-serif" font-size="12" fill="#212121">Digitalizace účtenek jednoduše</text>
</svg>
